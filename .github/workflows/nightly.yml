name: Nightly Release

on:
  workflow_dispatch: # push disabled — re-enable when nightly is ready
  # push:
  #   branches:
  #     - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete_tag:
    name: Delete Tag
    permissions:
      contents: write  # for gh release delete to remove tags and releases
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "1.0.0-SNAPSHOT" --yes --cleanup-tag --repo "${GH_REPO}" || true

  nightly:
    needs: delete_tag
    uses: ./.github/workflows/release.yml
    with:
      tag: "1.0.0-SNAPSHOT"
      dev: true
      cliTag: "2.0.0-nightly"
    secrets:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
